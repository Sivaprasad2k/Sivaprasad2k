    <polygon points="216,84 208,79 208,89" fill="#58a6ff"/>

    <!-- Node 2: Services & APIs -->
    <rect x="220" y="52" width="160" height="64" rx="8" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
    <text x="236" y="74" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700">STEP 02</text>
    <text x="236" y="94" fill="#f0f6fc" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Services &amp; APIs</text>

    <!-- Arrow 2 -->
    <path d="M 386 84 L 408 84" stroke="#3fb950" stroke-width="2"/>
    <polygon points="412,84 404,79 404,89" fill="#3fb950"/>

    <!-- Node 3: Scale & AI Integration -->
    <rect x="416" y="52" width="160" height="64" rx="8" fill="#0d1117" stroke="#a371f7" stroke-width="1.5"/>
    <text x="432" y="74" fill="#a371f7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700">STEP 03</text>
    <text x="432" y="94" fill="#f0f6fc" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Scale &amp; AI</text>

    <!-- Quote Box -->
