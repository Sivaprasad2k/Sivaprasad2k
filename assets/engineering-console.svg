  <text x="78" y="56" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1">● BACKEND ENGINEERING &amp; SYSTEM ARCHITECTURE</text>
  <text x="1140" y="56" text-anchor="end" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1">ENGINEERING HERO / 2026</text>

