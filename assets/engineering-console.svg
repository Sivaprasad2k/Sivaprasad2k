    <text x="16" y="215" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">▶ BUILDING</text>
    <text x="16" y="235" fill="#f0f6fc" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Krishi Platform</text>
    <text x="16" y="249" fill="#8b949e" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Workflow-driven agri ops</text>

    <!-- Avis Card -->
    <rect x="254" y="190" width="236" height="68" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="270" y="215" fill="#58a6ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">▶ BUILDING</text>
    <text x="270" y="235" fill="#f0f6fc" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Avis AI System</text>
    <text x="270" y="249" fill="#8b949e" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">AI inference &amp; backend service</text>
