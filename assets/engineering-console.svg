    <rect x="24" y="52" width="160" height="64" rx="8" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="40" y="74" fill="#58a6ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700">STEP 01</text>
    <text x="40" y="94" fill="#f0f6fc" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Domain &amp; Data</text>

