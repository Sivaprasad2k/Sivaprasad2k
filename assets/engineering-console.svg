<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Siva Prasad M L - Backend Engineering Hero</title>
  <desc id="desc">Personal engineering hero card highlighting Siva Prasad M L, Backend Engineering, system architecture model, and currently building projects.</desc>

  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#161b22" stroke-width="1"/>
