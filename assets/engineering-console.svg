  <!-- FOOTER BAR -->
  <line x1="40" y1="410" x2="1160" y2="410" stroke="#30363d" stroke-width="1"/>
  <text x="40" y="442" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
    CSE STUDENT · BACKEND ENGINEER · JAVA &amp; SPRING BOOT
  </text>
  <text x="1160" y="442" text-anchor="end" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
    GITHUB: @Sivaprasad2k
  </text>
