      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <!-- Outer Frame -->
  <rect width="1200" height="480" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <rect x="2" y="2" width="1196" height="476" rx="14" fill="url(#grid)" opacity="0.6"/>

  <!-- Header Status Bar -->
  <rect x="40" y="32" width="1120" height="40" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
